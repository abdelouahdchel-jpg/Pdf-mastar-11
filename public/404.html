<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found (404) – PDF Master</title>
    <meta name="robots" content="noindex, nofollow" />
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        box-sizing: border-box;
      }
      .card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        max-width: 480px;
        width: 100%;
        padding: 40px 32px;
        text-align: center;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      }
      .icon {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: #fee2e2;
        color: #dc2626;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 24px;
        font-weight: 800;
        margin: 0 0 10px;
      }
      p {
        font-size: 14px;
        color: #64748b;
        line-height: 1.5;
        margin: 0 0 24px;
      }
      .btn {
        display: inline-block;
        background: #dc2626;
        color: #ffffff;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 14px;
        transition: background 0.2s;
      }
      .btn:hover {
        background: #b91c1c;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">📄</div>
      <h1>Page Not Found (404)</h1>
      <p>The page or tool you are looking for does not exist or may have been moved.</p>
      <a href="/" class="btn">Return to PDF Master Home</a>
    </div>
  </body>
</html>
